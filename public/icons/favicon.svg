<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#0c1a33"/>
      <stop offset="1" stop-color="#05070c"/>
    </radialGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#00c2ff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#00c2ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx="34%" cy="28%" r="78%">
      <stop offset="0" stop-color="#e6fff0"/>
      <stop offset=".14" stop-color="#7dffc0"/>
      <stop offset=".38" stop-color="#00d6b4"/>
      <stop offset=".62" stop-color="#00a3ff"/>
      <stop offset=".84" stop-color="#1f6bff"/>
      <stop offset="1" stop-color="#071233"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f6bff"/>
      <stop offset=".5" stop-color="#00c2ff"/>
      <stop offset="1" stop-color="#2ef07a"/>
    </linearGradient>
    <clipPath id="front"><rect x="0" y="256" width="512" height="256"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="200" fill="url(#glow)"/>
  <g transform="rotate(-22 256 256)">
    <ellipse cx="256" cy="256" rx="186" ry="58" fill="none" stroke="url(#ring)" stroke-width="12" opacity=".55"/>
  </g>
  <circle cx="256" cy="256" r="116" fill="url(#planet)"/>
  <g transform="rotate(-22 256 256)">
    <ellipse cx="256" cy="256" rx="186" ry="58" fill="none" stroke="url(#ring)" stroke-width="12" clip-path="url(#front)"/>
    <circle cx="442" cy="256" r="13" fill="#2ef07a"/>
  </g>
</svg>
