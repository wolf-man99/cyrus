<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#2b1255"/>
      <stop offset="1" stop-color="#090611"/>
    </radialGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#b44cff" stop-opacity=".6"/>
      <stop offset="1" stop-color="#b44cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx="34%" cy="28%" r="78%">
      <stop offset="0" stop-color="#ffe6f6"/>
      <stop offset=".14" stop-color="#ff9ad9"/>
      <stop offset=".38" stop-color="#f05bc9"/>
      <stop offset=".62" stop-color="#b44cff"/>
      <stop offset=".84" stop-color="#8538f5"/>
      <stop offset="1" stop-color="#3a1290"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
