  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="200" fill="url(#glow)"/>
  <g transform="rotate(-22 256 256)">
    <ellipse cx="256" cy="256" rx="186" ry="58" fill="none" stroke="url(#ring)" stroke-width="12" opacity=".55"/>
  </g>
  <circle cx="256" cy="256" r="116" fill="url(#planet)"/>
  <g transform="rotate(-22 256 256)">
    <ellipse cx="256" cy="256" rx="186" ry="58" fill="none" stroke="url(#ring)" stroke-width="12" clip-path="url(#front)"/>
    <circle cx="442" cy="256" r="13" fill="#fff"/>
